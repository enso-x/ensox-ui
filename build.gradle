plugins {
    // net.fabricmc.fabric-loom: the non-remapping Loom for unobfuscated Minecraft (26.1+).
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

// gradlew publishLibrary: tests, then all three artifacts into the Maven directory given by
// -PmavenDir=<dir> or ENSOX_MAVEN_DIR (a checkout of the enso-x/maven Pages repository).
// Without either, it publishes into build/maven for a look at the result.
tasks.register('publishLibrary') {
    group = 'ensox ui'
    description = 'Tests and publishes ensox-ui-common, -fabric and -neoforge to the enso-x Maven directory.'
    dependsOn ':common:test'
    dependsOn(['common', 'fabric', 'neoforge'].collect { ":$it:publishMavenJavaPublicationToEnsoxRepository" })
}
