plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    // Minecraft is unobfuscated from 26.1: no mappings, mods are plain dependencies.
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // Only the resource loader module (client reload listener); consumers bring Fabric API anyway.
    implementation fabricApi.module('fabric-resource-loader-v1', fabric_version)
}

loom {
    accessWidenerPath.set(project(':common').file("src/main/resources/${mod_id}.accesswidener"))
    runs {
        client {
            client()
            setConfigName('Fabric Client (EnsoX UI)')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
    }
}
