# Every field used in resources must be in the expandProps map of
# buildSrc/src/main/groovy/multiloader-common.gradle.

# Project. The part before '+' follows semver: within one major version only
# backward compatible changes, because mods nest the library (jar-in-jar) and the
# loader keeps only the newest copy. See README.md.
version=1.1.0+26.3
group=com.ensox.ui
java_version=25

# Common
minecraft_version=26.3
mod_name=EnsoX UI
mod_author=EnsoX
mod_homepage=https://t.me/ensox
mod_id=ensox_ui
license=MIT
credits=
description=Widget, layout and painting framework for Minecraft screens. A library: it does nothing on its own.
# NeoForge builds are tied to one Minecraft version.
minecraft_version_range=[26.3]
neo_form_version=26.3-1

# Fabric. From 26.1 Minecraft is unobfuscated: the plugin is net.fabricmc.fabric-loom, which remaps nothing.
loom_version=1.19.3
fabric_version=0.165.2+26.3
fabric_loader_version=0.20.1

# NeoForge
neoforge_version=26.3.0.101
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.java.home=C:/Program Files/Java/jdk-25.0.3
